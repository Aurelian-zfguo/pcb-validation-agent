# LLM 调用配置
llm:
  provider: openai-compatible  # mock | openai-compatible（DeepSeek/Claude均走OpenAI兼容接口）
  base_url: https://api.deepseek.com/v1
  api_key: ""                  # 留空则读环境变量 DEEPSEEK_API_KEY / CLAUDE_API_KEY
  model: deepseek-chat
  timeout_seconds: 60

# B 项目知识检索服务（可选增强，服务不可用时自动降级，不影响校验主流程）
knowledge:
  # base_url 可被环境变量 KNOWLEDGE_BASE_URL 覆盖（容器内指向宿主 B 服务，如 http://host.docker.internal:8000）
  base_url: http://127.0.0.1:8000
  timeout_seconds: 15
  # 瞬时错误（连接失败/超时/5xx）的重试次数与指数退避基数；4xx 与 200 不重试
  retry_times: 2
  retry_backoff_seconds: 0.5

# 执行日志目录（相对项目根）
trace:
  dir: logs/traces

# 报告输出目录（相对项目根）
output:
  dir: output
